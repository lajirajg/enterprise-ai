name: Validate resource intake
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: read
concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: startsWith(github.event.issue.title, '[Resource]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate issue metadata without fetching the URL
        run: python scripts/intake.py "$GITHUB_EVENT_PATH" --output /tmp/resource-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-candidate-${{ github.event.issue.number }}
          path: /tmp/resource-candidate/*.json
          retention-days: 7
          if-no-files-found: error
